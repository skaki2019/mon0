[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "mon0"             # This must match your package directory name
version = "0.0.1"
requires-python = ">=3.9"

# Optional runtime dependencies can be listed here
# dependencies = []

[tool.scikit-build]
# This helps ensure compatibility with future versions
minimum-version = "0.4"
# The build directory can be set to keep things tidy
build-dir = "build/{wheel_tag}"
sdist.exclude = [".github"]

[tool.scikit-build.wheel]
packages = ["src/mon0"]

# [tool.scikit-build.wheel.exclude]
# patterns = ["__pycache__", "*.pyc", "*.pyo", "*.pyd"]